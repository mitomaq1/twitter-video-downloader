[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "frontend/dist"

# SPA routing için tüm route'ları index.html'e yönlendir
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  
# Functions (opsiyonel - backend için)
[functions]
  directory = "backend"

