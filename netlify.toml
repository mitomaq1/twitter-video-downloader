# Netlify Build Configuration for Twitter Video Downloader
[build]
  # Frontend klasöründe build yap
  base = "frontend"
  # Build komutu
  command = "npm install && npm run build"
  # Publish edilecek klasör (Vite build çıktısı)
  publish = "frontend/dist"

# SPA (Single Page Application) routing
# Tüm route'ları index.html'e yönlendir (React Router için)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Build environment variables
[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Headers (güvenlik ve performans)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

